<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Sayt</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #d50000, #b71c1c);
            color: white;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }

        header {
            background-color: rgba(183, 28, 28, 0.8);
            color: white;
            text-align: center;
            padding: 50px 20px;
            border-bottom: 5px solid #d50000;
            font-family: 'Great Vibes', cursive;
        }

        header h1 {
            font-size: 3.5em;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 15px 30px;
            background-color: #d50000;
            color: white;
            border: 2px solid #b71c1c;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
            margin-top: 20px;
            font-family: 'Roboto', sans-serif;
        }

        button:hover {
            background-color: #b71c1c;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        #password {
            padding: 15px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            width: 300px;
            margin-top: 20px;
            outline: none;
            transition: all 0.3s ease;
        }

        #password:focus {
            border-color: #d50000;
            transform: scale(1.05);
        }

        footer {
            background: linear-gradient(45deg, #d50000, #b71c1c);
            color: white;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-weight: bold;
            text-align: center;
        }

        /* Animatsiyalar */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes catMove {
            0% { transform: translate(0, 0); }
            25% { transform: translate(25vw, 10vh) rotate(10deg); }
            50% { transform: translate(50vw, 20vh) rotate(20deg); }
            75% { transform: translate(75vw, 10vh) rotate(30deg); }
            100% { transform: translate(100vw, 0) rotate(40deg); }
        }

        /* Mushukchani hayotiy animatsiyasi */
        .cat {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 80px;
            background-color: #000000; /* Mushuk rangi qora */
            border-radius: 50%;
            animation: catMove 5s ease-in-out infinite;
            z-index: 9999;
        }

        .cat::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #ff7043;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        .cat .name-tag {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Great Vibes', cursive;
            font-size: 18px;
            color: #2196F3; /* Ism yozuvi uchun ko'k rang */
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }

        .content {
            display: none;
        }

        /* Tugmalarni animatsiyasi */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-buttons a {
            padding: 15px 40px;
            background-color: #d50000;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 50px;
            transition: all 0.3s ease-in-out;
        }

        .nav-buttons a:hover {
            background-color: #b71c1c;
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

    </style>
</head>
<body>

    <!-- Parolni kiritish formasi -->
    <div id="passwordForm">
        <header>
            <h1>Saytga Kirish</h1>
            <p>Parolni kiriting:</p>
        </header>
        <div style="text-align: center;">
            <input type="password" id="password" placeholder="Parolni kiriting">
            <button onclick="checkPassword()">Kirish</button>
            <p id="error" class="error"></p>
        </div>
    </div>

    <!-- Asosiy Kontent -->
    <div id="content" class="content">
        <header>Sevgi Haqida</header>
        <div class="nav-buttons">
            <a href="#" onclick="showSection('asalim')">Asalim</a>
            <a href="#" onclick="showSection('yuragimni-egasi')">Yuragimni Egasi</a>
            <a href="#" onclick="showSection('hayotim')">Hayotim</a>
        </div>

        <div class="container">
            <section id="asalim" class="section">
                <h2>Asalim</h2>
                <p>Sen mening qalbimning eng yorqin yulduzisan.</p>
            </section>

            <section id="yuragimni-egasi" class="section">
                <h2>Yuragimni Egasi</h2>
                <p>Sen men uchun bebaho xazinasan.</p>
            </section>

            <section id="hayotim" class="section">
                <h2>Hayotim</h2>
                <p>Sen mening hayotimdagi eng katta baxtsan!</p>
            </section>
        </div>

        <footer>
            © 2025 Sayt – Yuragimda | Ishlab chiqildi: ANVARBEK
        </footer>
    </div>

    <!-- Mushukcha Animatsiyasi -->
    <div class="cat">
        <div class="name-tag">Zinnura</div>
    </div>

    <script>
        const correctPassword1 = "jinnivoyim"; // Birinchi parol
        const correctPassword2 = "1444"; // Ikkinchi parol

        function checkPassword() {
            const enteredPassword = document.getElementById("password").value;
            const errorElement = document.getElementById("error");
            const contentElement = document.getElementById("content");
            const passwordField = document.getElementById("password");

            // Xatolikni tozalash
            errorElement.textContent = "";

            // Parolni tekshirish
            if (enteredPassword === correctPassword1) {
                // Birinchi parol to'g'ri bo'lsa, asosiy kontentni ko'rsatish
                document.getElementById("passwordForm").style.display = "none";
                contentElement.style.display = "block";
                document.body.style.backgroundColor = "#ffffff"; // Sayt fonini o'zgartirish
            } else if (enteredPassword === correctPassword2) {
                // Ikkinchi parol to'g'ri bo'lsa, saytdagi barcha kontentni yashirish
                document.getElementById("passwordForm").style.display = "none";
                contentElement.style.display = "none"; // Kontentni yashirish
                document.body.style.backgroundColor = "#ffffff"; // Sayt fonini o'zgartirish
            } else {
                // Parol noto'g'ri bo'lsa, xato xabarini ko'rsatish
                passwordField.classList.add("error");
                errorElement.textContent = "Xato parol! Iltimos, qayta urinib ko'ring.";
            }
        }

        // Bo'limlarni ko'rsatish
        function showSection(sectionId) {
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => {
                if (section.id === sectionId) {
                    section.style.display = "block";
                } else {
                    section.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>
